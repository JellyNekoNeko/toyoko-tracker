name: Desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ToyokoTracker-windows
            path: dist/ToyokoTracker
          - os: ubuntu-latest
            artifact: ToyokoTracker-linux
            path: dist/ToyokoTracker
          - os: macos-latest
            artifact: ToyokoTracker-macos
            path: dist/ToyokoTracker.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
