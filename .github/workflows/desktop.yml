name: Desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ToyokoTracker-windows
            path: dist/ToyokoTracker
          - os: ubuntu-latest
            artifact: ToyokoTracker-linux
            path: dist/ToyokoTracker
          - os: macos-latest
            artifact: ToyokoTracker-macos
            path: dist/ToyokoTracker.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
