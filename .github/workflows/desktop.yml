name: Desktop bundles

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ToyokoTracker-windows
            archive: ToyokoTracker-windows-x64.zip
          - os: ubuntu-latest
            artifact: ToyokoTracker-linux
            archive: ToyokoTracker-linux-x64.tar.gz
          - os: macos-latest
            artifact: ToyokoTracker-macos
            archive: ToyokoTracker-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          expected="desktop-v$(python -c 'from toyoko_tracker.desktop_version import DESKTOP_VERSION; print(DESKTOP_VERSION)')"
          python -c 'from importlib.metadata import version; from toyoko_tracker.desktop_version import DESKTOP_VERSION; assert DESKTOP_VERSION == version("toyoko-tracker"), "desktop and WebUI versions must match"'
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match desktop version $expected"
            exit 1
          }
      - run: python build_desktop.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ToyokoTracker -DestinationPath ${{ matrix.archive }}
      - if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} ToyokoTracker
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ToyokoTracker.app ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum ToyokoTracker-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG"
          fi
