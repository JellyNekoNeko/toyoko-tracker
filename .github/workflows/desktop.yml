name: Desktop bundles

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: ToyokoTracker-windows-x64
            archive: ToyokoTracker-windows-x64.zip
          - os: windows-11-arm
            artifact: ToyokoTracker-windows-arm64
            archive: ToyokoTracker-windows-arm64.zip
          - os: ubuntu-24.04
            artifact: ToyokoTracker-linux-x64
            archive: ToyokoTracker-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            artifact: ToyokoTracker-linux-arm64
            archive: ToyokoTracker-linux-arm64.tar.gz
          - os: macos-15
            artifact: ToyokoTracker-macos-arm64
            archive: ToyokoTracker-macos-arm64.zip
          - os: macos-15-intel
            artifact: ToyokoTracker-macos-x64
            archive: ToyokoTracker-macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          expected="desktop-v$(python -c 'from toyoko_tracker.desktop_version import DESKTOP_VERSION; print(DESKTOP_VERSION)')"
          python -c 'from importlib.metadata import version; from toyoko_tracker.desktop_version import DESKTOP_VERSION; assert DESKTOP_VERSION == version("toyoko-tracker"), "desktop and WebUI versions must match"'
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match desktop version $expected"
            exit 1
          }
      - run: python build_desktop.py
      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "toyoko-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool.FullName sign /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com `
            /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            dist/ToyokoTracker/ToyokoTracker.exe
          & $signtool.FullName verify /pa dist/ToyokoTracker/ToyokoTracker.exe
          Remove-Item -Force $certificate
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/toyoko-signing.p12"
          keychain="$RUNNER_TEMP/toyoko-signing.keychain-db"
          CERTIFICATE_PATH="$certificate" python -c 'import base64, os; open(os.environ["CERTIFICATE_PATH"], "wb").write(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))'
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k actions "$keychain"
      - name: Sign macOS application
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          codesign --force --deep --strict --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" dist/ToyokoTracker.app
          codesign --verify --deep --strict --verbose=2 dist/ToyokoTracker.app
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ToyokoTracker -DestinationPath ${{ matrix.archive }}
      - if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} ToyokoTracker
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ToyokoTracker.app ${{ matrix.archive }}
      - name: Notarize macOS application
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          xcrun notarytool submit "${{ matrix.archive }}" --wait \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple dist/ToyokoTracker.app
          rm -f "${{ matrix.archive }}"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ToyokoTracker.app "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum ToyokoTracker-* > SHA256SUMS.txt
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG"
          fi
