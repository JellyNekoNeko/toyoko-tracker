[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toyoko-tracker"
version = "0.7.0"
description = "Toyoko Inn Vacancy Tracker"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "bilibili @果冻猫猫丶" }
]

keywords = ["toyoko-inn", "hotel", "vacancy", "flask", "playwright", "tracker"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Utilities"
]

# ---- Runtime dependencies ----
dependencies = [
  "Flask>=2.2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tqdm>=4.66",
  "tzdata>=2025.2; sys_platform == 'win32'"
]

# ---- Optional / extra dependencies (PEP 621 compliant) ----
[project.optional-dependencies]
playwright = [
  "playwright>=1.45"
]
mobile = [
  "waitress>=3.0,<4",
  "segno>=1.6,<2"
]
desktop = [
  "pywebview>=5.4,<7",
  "PyGObject>=3.48,<4; sys_platform == 'linux'"
]
desktop-build = [
  "pywebview>=5.4,<7",
  "PyGObject>=3.48,<4; sys_platform == 'linux'",
  "pyinstaller>=6.11,<7"
]
all = [
  "playwright>=1.45",
  "waitress>=3.0,<4",
  "segno>=1.6,<2"
]
dev = [
  "build>=1.2.1",
  "twine>=4.0.2",
  "wheel",
  "setuptools>=77",
  "ruff",
  "pytest"
]

[project.scripts]
toyoko-tracker = "toyoko_tracker.app:main"
toyoko-tracker-desktop = "toyoko_tracker.desktop:main"
toyoko-tracker-stress = "toyoko_tracker.simulation:main"

[project.urls]
Homepage = "https://github.com/JellyNekoNeko/toyoko-tracker"
Source = "https://github.com/JellyNekoNeko/toyoko-tracker"
Issues = "https://github.com/JellyNekoNeko/toyoko-tracker/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["toyoko_tracker*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"toyoko_tracker" = ["*.json", "static/*.css", "static/*.js", "static/*.png"]
